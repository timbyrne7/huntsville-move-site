      <path d="M38 136 L50 104 L62 136 Z" fill="#000000"/>
      <rect x="38" y="140" width="24" height="7" fill="#000000"/>
      <rect x="38" y="168" width="24" height="8" fill="#ffffff"/>
      <rect x="38" y="196" width="24" height="8" fill="#ffffff"/>
      <path d="M38 224 L28 240 L38 240 Z" fill="#000000"/>
      <path d="M62 224 L72 240 L62 240 Z" fill="#000000"/>
      <rect x="36" y="238" width="28" height="10" fill="#000000"/>
    </g>
    <!-- blocks, front of the rocket -->
    <rect x="88" y="176" width="40" height="72.0" fill="#000000"/>
    <rect x="100" y="166" width="16" height="10" fill="#000000"/>
    <rect x="130" y="152" width="34" height="96.0" fill="#000000"/>
    <rect x="138" y="142" width="18" height="10" fill="#000000"/>
    <rect x="174" y="186" width="44" height="62.0" fill="#000000"/>
    <rect x="228" y="164" width="44" height="84.0" fill="#000000"/>
    <rect x="238" y="154" width="24" height="10" fill="#000000"/>
    <rect x="282" y="196" width="18" height="52.0" fill="#000000"/>
    <!-- windows -->
